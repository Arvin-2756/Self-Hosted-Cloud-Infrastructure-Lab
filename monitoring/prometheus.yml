global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerting-rules.yml

scrape_configs:
  - job_name: proxmox
    static_configs:
      - targets:
          - proxmox.example.com:9221

  - job_name: node-exporter
    static_configs:
      - targets:
          - 192.168.1.201:9100
          - 192.168.1.202:9100
          - 192.168.1.203:9100
          - 192.168.1.204:9100
          - 192.168.1.205:9100
