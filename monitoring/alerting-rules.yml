groups:
  - name: homelab-availability
    rules:
      - alert: HomelabTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Homelab monitoring target is down"
          description: "{{ $labels.instance }} has been unavailable for more than five minutes."

      - alert: HostMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory is low"
          description: "{{ $labels.instance }} has less than 10% memory available."
